<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Night Blood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game-shell">

    <header>

        <div class="brand">
            <div class="eyebrow">BROOKLYN • 1996</div>
            <h1>NIGHT BLOOD</h1>
            <div class="subtitle">
                Prototype 0.3 — Visual Pass I / III
            </div>
        </div>

        <div class="controls">
            <span>A / D</span> MOVE
            <span>SPACE</span> JUMP
            <span>J</span> ATTACK
            <span>K / SHIFT</span> DASH
        </div>

    </header>

    <main>
        <div id="canvas-frame">
            <canvas
                id="game"
                width="480"
                height="270"
            ></canvas>

            <div class="scanlines"></div>
            <div class="vignette"></div>
        </div>
    </main>

    <footer>
        Original gothic urban pixel-art prototype
    </footer>

</div>

<script src="game.js"></script>

</body>
</html>
