<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Night Blood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game-shell">

    <header>

        <div>
            <h1>NIGHT BLOOD</h1>
            <p>Prototype 0.2 — Brooklyn, 1996</p>
        </div>

        <div class="controls">
            MOVE: A/D &nbsp;
            JUMP: SPACE &nbsp;
            ATTACK: J &nbsp;
            DASH: K / SHIFT
        </div>

    </header>

    <canvas
        id="game"
        width="960"
        height="540"
    ></canvas>

    <footer>
        Original browser prototype • Gothic urban pixel-art metroidvania
    </footer>

</div>

<script src="game.js"></script>

</body>
</html>
