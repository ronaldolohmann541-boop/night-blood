<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Night Blood</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game-shell">

    <header>

        <div>
            <div class="city">BROOKLYN • 1996</div>
            <h1>NIGHT BLOOD</h1>
            <div class="version">
                Prototype 0.4 — Gothic Brooklyn
            </div>
        </div>

        <div class="controls">
            <span>A / D</span> MOVE
            <span>SPACE</span> JUMP
            <span>J</span> ATTACK
            <span>K / SHIFT</span> DASH
        </div>

    </header>

    <div id="frame">

        <canvas
            id="game"
            width="640"
            height="360"
        ></canvas>

        <div class="scanlines"></div>
        <div class="vignette"></div>

    </div>

    <footer>
        THE NIGHT IS ONLY BEGINNING
    </footer>

</div>

<script src="game.js"></script>

</body>
</html>
